<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Equipos</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; max-width: 600px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h1, h2, h3 { color: #333; text-align: center; }
        .correctivo-card { border-left: 5px solid #0288d1; }
        
        /* Buscador con Autocompletado */
        .filter-container { margin-bottom: 20px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1>Historial de Equipos</h1>
    <div id="info-equipo">Cargando información del equipo...</div>

    <div class="filter-container" id="seccion-filtro" style="display: none;">
        <h3>Mantenimientos Correctivos</h3>
        <input 
            type="text" 
            id="filtroPieza" 
            list="lista-piezas" 
            placeholder="Escribe para buscar pieza/componente..."
            autocomplete="off"
        >
        <datalist id="lista-piezas"></datalist>
    </div>

    <div id="lista-correctivos"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // === REEMPLAZA ESTO CON TUS CREDENCIALES DE FIREBASE ===
        const firebaseConfig = {
          apiKey: "AIzaSyBdgcmYF3-NYxm7ta-vO0RXRDQXhZf4xq4",
          authDomain: "navarreteequipos.firebaseapp.com",
          projectId: "navarreteequipos",
          storageBucket: "navarreteequipos.firebasestorage.app",
          messagingSenderId: "131453739262",
          appId: "1:131453739262:web:5bbec395040800f188c5af",
          measurementId: "G-DTF0V3WWS6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let correctivosGlobales = [];

        async function cargarDatos() {
            const divEquipo = document.getElementById('info-equipo');
            const divCorrectivos = document.getElementById('lista-correctivos');
            const urlParams = new URLSearchParams(window.location.search);
            const equipoNombre = urlParams.get('equipo');

            if (!equipoNombre) {
                divEquipo.innerHTML = "<p style='color: red;'>No se especificó un equipo en la URL.</p>";
                return;
            }

            try {
                const equipoRef = doc(db, "equipos", equipoNombre);
                const equipoSnap = await getDoc(equipoRef);

                if (!equipoSnap.exists()) {
                    divEquipo.innerHTML = `<p style='color: red;'>El equipo <b>${equipoNombre}</b> no existe.</p>`;
                    return;
                }

                const dataEquipo = equipoSnap.data();
                divEquipo.innerHTML = `
                    <div class="card">
                        <h2>${dataEquipo.nombreEquipo || equipoNombre}</h2>
                        <p><b>Marca:</b> ${dataEquipo.marca || 'N/A'}</p>
                        <p><b>Modelo:</b> ${dataEquipo.modelo || 'N/A'}</p>
                        <p><b>Fecha de Instalación:</b> ${dataEquipo.fechaInstalacion || 'N/A'}</p>
                    </div>
                `;

                const correctivosRef = collection(db, "equipos", equipoNombre, "correctivos");
                const correctivosSnap = await getDocs(correctivosRef);

                if (correctivosSnap.empty) {
                    divCorrectivos.innerHTML = "<p style='text-align:center;'>No hay registros de mantenimientos correctivos.</p>";
                    return;
                }

                correctivosGlobales = correctivosSnap.docs.map(doc => doc.data());

                correctivosGlobales.sort((a, b) => {
                    const parseFecha = (fechaStr) => {
                        if (!fechaStr) return 0;
                        const partes = fechaStr.split('/');
                        if (partes.length === 3) {
                            return new Date(`${partes[2]}-${partes[1]}-${partes[0]}`).getTime();
                        }
                        return 0;
                    };
                    return parseFecha(b.fechaCorrectivo) - parseFecha(a.fechaCorrectivo);
                });

                document.getElementById('seccion-filtro').style.display = 'block';
                
                actualizarOpcionesAutocompletado("");
                renderizarCorrectivos(correctivosGlobales);

            } catch (error) {
                console.error("Error al consultar Firestore:", error);
                divEquipo.innerHTML = `<p style='color: red;'>Error al cargar los datos: ${error.message}</p>`;
            }
        }

        function actualizarOpcionesAutocompletado(textoBusqueda) {
            const dataList = document.getElementById('lista-piezas');
            dataList.innerHTML = '';

            const piezasUnicas = [...new Set(correctivosGlobales.map(c => c.piezaComponente).filter(Boolean))];

            const piezasFiltradas = piezasUnicas.filter(pieza => 
                pieza.toUpperCase().includes(textoBusqueda.toUpperCase())
            );

            piezasFiltradas.forEach(pieza => {
                const option = document.createElement('option');
                option.value = pieza;
                dataList.appendChild(option);
            });
        }

        function renderizarCorrectivos(lista) {
            const divCorrectivos = document.getElementById('lista-correctivos');
            divCorrectivos.innerHTML = '';

            if (lista.length === 0) {
                divCorrectivos.innerHTML = "<p style='text-align:center;'>No se encontraron coincidencias.</p>";
                return;
            }

            lista.forEach(corr => {
                divCorrectivos.innerHTML += `
                    <div class="card correctivo-card">
                        <p><b>Pieza / Componente:</b> ${corr.piezaComponente || 'N/A'}</p>
                        <p><b>Marca:</b> ${corr.marca || 'N/A'}</p>
                        <p><b>Modelo:</b> ${corr.modelo || 'N/A'}</p>
                        <p><b>Actividad:</b> ${corr.actividad || 'N/A'}</p>
                        <p><b>Proveedor:</b> ${corr.proveedor || 'N/A'}</p>
                        <p><b>Fecha Correctivo:</b> ${corr.fechaCorrectivo || 'N/A'}</p>
                    </div>
                `;
            });
        }

        const inputFiltro = document.getElementById('filtroPieza');

        inputFiltro.addEventListener('input', (e) => {
            const valor = e.target.value.trim();
            
            actualizarOpcionesAutocompletado(valor);

            const listaFiltrada = correctivosGlobales.filter(corr => {
                const pieza = (corr.piezaComponente || '').toUpperCase();
                return pieza.includes(valor.toUpperCase());
            });
            renderizarCorrectivos(listaFiltrada);
        });

        cargarDatos();
    </script>
</body>
</html>
